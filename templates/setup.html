{% extends "base.html" %}
{% block title %}Set up · ReleaseRadar{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Welcome to ReleaseRadar</h1>
  <p class="muted">This is a single-user tool. Set a password to protect access.
     Only you will be able to log in.</p>
  <form method="post" class="stack">
    <label>Password
      <input type="password" name="password" autocomplete="new-password" required minlength="8">
    </label>
    <label>Confirm password
      <input type="password" name="confirm" autocomplete="new-password" required minlength="8">
    </label>
    <button type="submit" class="btn primary">Set password &amp; continue</button>
  </form>
  <p class="muted small">Stored only as a salted hash. Minimum 8 characters.</p>
</div>
{% endblock %}
