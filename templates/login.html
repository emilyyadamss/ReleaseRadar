{% extends "base.html" %}
{% block title %}Log in · ReleaseRadar{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Log in</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Password
      <input type="password" name="password" autocomplete="current-password"
             required autofocus {% if locked %}disabled{% endif %}>
    </label>
    <button type="submit" class="btn primary" {% if locked %}disabled{% endif %}>
      Log in
    </button>
  </form>
  {% if locked %}
    <p class="muted small">Locked for {{ remaining }} more seconds after too many attempts.</p>
  {% endif %}
</div>
{% endblock %}
